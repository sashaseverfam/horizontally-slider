<div class="photo-slider">
  <lib-horizontally-slider
    [showAlwaysArrows]="true"
    [scrollRefresh$]="scrollRefresh$"
  >
    <div left-arrow class="photo-slider__arrow photo-slider__arrow--left">
      <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
        <path fill="currentColor" d="M20.547 21.453l-6.107-6.12 6.107-6.12-1.88-1.88-8 8 8 8z"></path>
      </svg>
    </div>

    <div slider class="photo-slider__track">
      @for (photo of photos(); track photo; let i = $index) {
        <div
          class="photo-slider__item"
          [class.photo-slider__item--active]="selectedIndex() === i"
          (click)="selectItem(i)"
        >
          <img [src]="photo.url" [alt]="photo.alt" />
          <p>{{ photo.name }}</p>
        </div>
      }
    </div>

    <div right-arrow class="photo-slider__arrow photo-slider__arrow--right">
      <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
        <path fill="currentColor" d="M11.453 21.787l6.107-6.12-6.107-6.12 1.88-1.88 8 8-8 8z"></path>
      </svg>
    </div>

  </lib-horizontally-slider>
</div>
