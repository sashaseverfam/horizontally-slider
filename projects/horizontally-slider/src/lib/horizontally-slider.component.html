<div
  #leftArrow
  class="horizontally-slider__arrow horizontally-slider__arrow--left"
  [class.horizontally-slider__arrow--visible]="showAlwaysArrows ? isLeftArrowVisible : isLeftArrowVisible && !isTouchDevice"
>
  <ng-content select="[left-arrow]"></ng-content>
</div>

<div
  #track
  class="horizontally-slider__track"
  [class.horizontally-slider__track--no-gap]="variant === 'no-gap'"
>
  <ng-content select="[slider]"></ng-content>
</div>

<div
  #rightArrow
  class="horizontally-slider__arrow horizontally-slider__arrow--right"
  [class.horizontally-slider__arrow--visible]="showAlwaysArrows ? isRightArrowVisible : isRightArrowVisible && !isTouchDevice"
>
  <ng-content select="[right-arrow]"></ng-content>
</div>
